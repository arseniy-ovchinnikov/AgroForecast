# =============================================================================
# AgroForecast — конфигурация пайплайна
# Прогноз урожайности зерновых и зернобобовых культур по субъектам РФ
# =============================================================================
# Все пути относительны корня проекта (project_root), если не начинаются с "/"
# или буквы диска. Корень определяется автоматически как родитель каталога
# configs/, либо переопределяется переменной окружения AGROFORECAST_ROOT.
# =============================================================================

project:
  name: AgroForecast
  target: yield_c_ha
  target_unit: "ц/га"
  crop: "Зерновые и зернобобовые культуры"
  farm_category: "Хозяйства всех категорий"

paths:
  data: data
  era5_dir: data/ERA5
  rosstat_dir: data/Rosstat
  boundaries_dir: data/boundaries

  # --- Первичные файлы -------------------------------------------------------
  # NetCDF ERA5-Land (месячные средние). Список: используется первый найденный.
  era5_files:
    - data/ERA5/data_stream_moda.nc
    - data/ERA5/data_stream-moda.nc
  boundaries_geojson: data/boundaries/ru.json

  # «Регионы России. Социально-экономические показатели», раздел 13 —
  # ОСНОВНОЙ источник длинных годовых рядов по субъектам (2000–2024).
  regions_of_russia_xlsx: data/Rosstat/Раздел 13 - Сельское хозяйство.xlsx

  # Оперативные бюллетени ГМЦ Росстата за 2025 г. (расширяют панель на 2025 г.)
  gmc_val_2025_xlsx: data/Rosstat/Val1_2025_v2.xlsx
  gmc_posev_2025_xlsx: data/Rosstat/Posev_2025_v2.xlsx

  # Витрина ЕМИСС — используется ТОЛЬКО для перекрёстной проверки урожайности.
  emiss_yield_xls: data/Rosstat/Урожайность сельскохозяйственных культур (в расчёте на убранную площадь).xls

  # Сборник «Сельское хозяйство в России. 2025» — резервный источник.
  agriculture_2025_xlsx: data/Rosstat/agriculture_2025.xlsx

  # --- Выходные каталоги -----------------------------------------------------
  results: results
  raw_processed: results/raw_processed
  features_dir: results/features
  models_results: results/models
  predictions: results/predictions
  reports: results/reports
  models_dir: models
  logs: logs

# =============================================================================
# Извлечение из «Регионы России», раздел 13
# =============================================================================
rosstat:
  # Лист -> (имя показателя, единица измерения, строка с годами 0-based)
  sheets:
    yield_grain:
      sheet: "13.11."
      column: yield_c_ha
      unit: "ц/га"
      description: "Урожайность зерновых и зернобобовых культур (в весе после доработки), хозяйства всех категорий"
    sown_area_grain:
      sheet: "13.5."
      column: sown_area_grain_kha
      unit: "тыс. га"
      description: "Посевные площади зерновых и зернобобовых культур, хозяйства всех категорий"
    sown_area_total:
      sheet: "13.4."
      column: sown_area_total_kha
      unit: "тыс. га"
      description: "Посевные площади сельскохозяйственных культур (всего), хозяйства всех категорий"
    gross_harvest_grain:
      sheet: "13.10."
      column: gross_harvest_kt
      unit: "тыс. т"
      description: "Валовой сбор зерна (в весе после доработки), хозяйства всех категорий"
    fert_mineral:
      sheet: "13.21.1."
      column: fert_mineral_kg_ha
      unit: "кг/га"
      description: "Внесение минеральных удобрений на 1 га посева (в пересчёте на 100% питательных веществ), сельхозорганизации"
    fert_organic:
      sheet: "13.21.2."
      column: fert_organic_t_ha
      unit: "т/га"
      description: "Внесение органических удобрений на 1 га посева, сельхозорганизации"

  # Строки-агрегаты, которые ДОЛЖНЫ быть исключены из панели субъектов.
  aggregate_markers:
    - "Российская Федерация"
    - "федеральный округ"
  # Значения-заглушки Росстата, трактуемые как пропуск (НЕ как ноль).
  missing_tokens: ["-", "–", "—", "...", "…", ".", "", "нд", "н.д."]

# =============================================================================
# ERA5-Land
# =============================================================================
era5:
  variables: [t2m, swvl1, ssrd, tp, pev]
  # Ожидаемая структура (проверяется, при расхождении — ошибка с диагностикой)
  expected:
    lat_range: [41.0, 82.0]
    lon_range: [19.0, 180.0]
    resolution_deg: 0.1
  # Пересчёт единиц ERA5 -> физические
  unit_conversion:
    t2m: kelvin_to_celsius        # K -> °C
    tp: m_per_day_to_mm_month     # м/сут -> мм/мес (× 1000 × дней в месяце)
    pev: m_per_day_to_mm_month    # м/сут -> мм/мес (знак инвертируется, см. код)
    ssrd: j_per_m2_to_mj_per_m2   # Дж/м²/сут -> МДж/м²/мес
    swvl1: none                   # м³/м³
  # Агрегирование по полигону: 'mean' по всем ячейкам, центр которых внутри.
  aggregation: mean
  # Минимальное число ячеек ERA5 на регион; ниже — предупреждение в логе.
  min_cells_per_region: 1

# =============================================================================
# Признаки
# =============================================================================
features:
  # Вегетационный сезон для агрегатов (месяцы включительно)
  season_months: [4, 5, 6, 7, 8, 9]
  # Месяцы, выносимые в отдельные помесячные признаки
  monthly_months: [4, 5, 6, 7, 8, 9]
  # Порог для счётчиков «тёплых»/«холодных» месяцев, °C
  warm_month_threshold_c: 15.0
  cold_month_threshold_c: 5.0
  # Лаги урожайности (без заполнения пропусков!)
  yield_lags: [1, 2, 3]
  sown_area_lags: [1]
  # Скользящее среднее урожайности по предыдущим годам
  yield_rolling_windows: [3, 5]

# =============================================================================
# Валидация и модели
# =============================================================================
validation:
  # Расширяющееся окно: обучение [train_start .. Y-1], тест Y
  train_start_year: 2001          # первый год, где доступен yield_lag_1
  test_years: [2020, 2021, 2022, 2023, 2024]
  min_train_years: 8
  focus_region: "Республика Хакасия"

models:
  catboost:
    iterations: 2000
    learning_rate: 0.03
    depth: 6
    l2_leaf_reg: 3.0
    loss_function: RMSE
    random_seed: 42
    early_stopping_rounds: 200
    verbose: 0
  random_forest:
    n_estimators: 600
    max_depth: 14
    min_samples_leaf: 3
    random_state: 42
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 600
    learning_rate: 0.05
    max_depth: 8
    min_samples_leaf: 10
    random_state: 42

  # Наборы признаков для сравнения (см. src/features/leakage.py)
  feature_sets:
    - baseline_historical
    - climate_only
    - climate_plus_history
    - climate_history_agro

logging:
  level: INFO
  file: logs/agroforecast.log

# =============================================================================
# MIDAS-наукастинг (scripts/07_midas_nowcast.py)
# =============================================================================
midas:
  # Первый год обучающей выборки. Раньше 2005 г. недоступно скользящее
  # среднее урожайности за 5 предыдущих лет.
  train_start_year: 2005
  # Тестовые годы: 13 периодов вместо 5 — тест Диболда–Мариано при T = 5
  # практически не имеет мощности.
  test_years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  schemes: [beta, almon, umidas]
  n_starts: 6
  bootstrap_iterations: 300
